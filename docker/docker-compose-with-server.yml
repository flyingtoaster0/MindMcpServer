version: "3.9"

services:
  mind-mcp:
    build: .
    command: >
      --stdio "REDIS_HOST=redis MIND_USERNAME=${MIND_USERNAME} MIND_PASSWORD=${MIND_PASSWORD} MIND_BASE_URL=${MIND_BASE_URL} MIND_TIMEZONE=${MIND_TIMEZONE} java -jar /mind-mcp.jar"
      --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ../server/build/libs/server-0.0.1-SNAPSHOT.jar:/mind-mcp.jar
    stdin_open: true
    tty: true
    restart: "no"

  redis:
    image: redis:7
    container_name: mind-mcp-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

  mind:
    container_name: mind
    image: mrcas/mind:latest
    volumes:
      - "mind-db:/app/db"
    environment:
      - TZ=America/Toronto
    ports:
      - "8086:8080"
    restart: always

volumes: 
  redis_data:
  mind-db:
