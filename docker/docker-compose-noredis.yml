version: "3.9"

services:
  mind-mcp:
    image: flyingtoaster0/mind-mcp:latest
    command: >
      --stdio "REDIS_HOST=redis MIND_USERNAME=${MIND_USERNAME} MIND_PASSWORD=${MIND_PASSWORD} MIND_BASE_URL=${MIND_BASE_URL} MIND_TIMEZONE=${MIND_TIMEZONE} NOTIFICATION_SERVICE_ID=${NOTIFICATION_SERVICE_ID} java -Dspring.profiles.active=noredis -jar /mind-mcp.jar"
      --port 8000
    ports:
      - "8000:8000"
    stdin_open: true
    tty: true
    restart: "no"

volumes: 
  redis_data:
