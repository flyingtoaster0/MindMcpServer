debug: false
logging:
  pattern:
    console:

spring:
  application:
    name: MindMcpServer
  ai:
    mcp:
      server:
        name: MindMcpServer
        version: 0.0.1
        stdio: true
  main:
    web-application-type: none
    banner-mode: off
    bannerMode: off
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

mind:
  username: ${MIND_USERNAME}
  password: ${MIND_PASSWORD}
  base_url: ${MIND_BASE_URL}
  timezone: ${MIND_TIMEZONE}
  notification_service_id: ${NOTIFICATION_SERVICE_ID}



